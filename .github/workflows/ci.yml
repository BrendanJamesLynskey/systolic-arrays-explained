name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The jobs of the companion sites' CI:
#   - model: the Python reference's tests pass, the parity fixtures it
#     writes are up to date, and the RTL cross-check (the SystemVerilog
#     output-stationary array in Verilator, every accumulator after every
#     clock edge against the model) still matches;
#   - lint, format and typecheck;
#   - unit tests (the TypeScript model against the Python fixtures, exactly;
#     key animation frames; the chapters' code, equations, links and quoted
#     values) with coverage thresholds;
#   - e2e on a production build under --no-experimental-require-module;
#   - Lighthouse CI (performance, accessibility, best practices >= 90).

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  data:
    name: Model and fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: reference/requirements.txt
      - run: pip install -r reference/requirements.txt
      - name: Parity fixtures are up to date
        run: python scripts/make_fixtures.py --check
      - name: Reference model tests
        run: python -m pytest -q tests/python
      # Ubuntu 24.04's verilator package is 5.020, the version the committed
      # rtl/rtl_check.json was recorded with.
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: RTL cross-check (Verilator, cycle by cycle)
        run: python rtl/check_rtl.py --check

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [data, lint-and-typecheck, unit-tests]
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e:install
      # playwright.config.ts builds, then serves under
      # `node --no-experimental-require-module` (see the comment there).
      - run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: [data, lint-and-typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Starts `pnpm start`, audits six pages three times each, and fails on
      # any category below 0.9 (lighthouserc.json).
      - run: pnpm lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 7
